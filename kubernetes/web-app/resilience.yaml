apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: flask-api, namespace: web-app }
spec: { scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: flask-api }, minReplicas: 3, maxReplicas: 12, metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: flask-api, namespace: web-app }
spec: { minAvailable: 2, selector: { matchLabels: { app: flask-api } } }
