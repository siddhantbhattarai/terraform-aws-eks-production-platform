apiVersion: apps/v1
kind: Deployment
metadata: { name: api, namespace: production-demo }
spec:
  replicas: 3
  selector: { matchLabels: { app: api } }
  template:
    metadata: { labels: { app: api } }
    spec:
      containers:
        - name: api
          image: nginx:1.27-alpine
          ports: [{ containerPort: 80 }]
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 256Mi } }
          readinessProbe: { httpGet: { path: /, port: 80 }, initialDelaySeconds: 5 }
---
apiVersion: v1
kind: Service
metadata: { name: api, namespace: production-demo }
spec: { selector: { app: api }, ports: [{ port: 80, targetPort: 80 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: api, namespace: production-demo }
spec: { scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: api }, minReplicas: 3, maxReplicas: 10, metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }] }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: api, namespace: production-demo }
spec: { minAvailable: 2, selector: { matchLabels: { app: api } } }
