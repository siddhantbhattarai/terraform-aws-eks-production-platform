<!doctype html><html><head><title>EKS web application</title><style>body{font:18px system-ui;background:#071b35;color:white;display:grid;place-content:center;min-height:90vh}main{padding:3rem;border:1px solid #69ddff;border-radius:16px;max-width:600px}button{padding:.8rem 1.2rem}</style></head><body><main><h1>Amazon EKS web application</h1><p>Frontend pod → Flask API service → EKS worker nodes.</p><button onclick="loadMessage()">Call Flask API</button><p id="result">Waiting for API.</p></main><script>async function loadMessage(){let r=await fetch('/api/message');let d=await r.json();result.textContent=d.message}</script></body></html>
