name: Publish application images

on:
  push:
    branches: [main]
    paths:
      - "applications/**"
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  IMAGE_TAG: ${{ github.sha }}

jobs:
  configuration:
    runs-on: ubuntu-latest
    outputs:
      aws_oidc_ready: ${{ steps.verify.outputs.aws_oidc_ready }}
    steps:
      - id: verify
        name: Verify AWS OIDC configuration
        env:
          ROLE_TO_ASSUME: ${{ vars.AWS_ROLE_TO_ASSUME }}
        run: |
          if [ -z "$ROLE_TO_ASSUME" ]; then
            echo "::warning::Image publishing was skipped: set the AWS_ROLE_TO_ASSUME repository variable after creating the GitHub OIDC IAM role."
            echo "aws_oidc_ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "aws_oidc_ready=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    needs: configuration
    if: needs.configuration.outputs.aws_oidc_ready == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: applications/frontend
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/eks-platform-production/frontend:${{ env.IMAGE_TAG }}

      - name: Build and push Flask API
        uses: docker/build-push-action@v6
        with:
          context: applications/flask-api
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/eks-platform-production/flask-api:${{ env.IMAGE_TAG }}
